name: Main

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Test (types)
        run: pnpm --filter "ponder" test:typecheck
 
  bundle:
    name: Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Bundle
        run: pnpm --filter "ponder-examples-with-nextjs-frontend" build

  test:
    name: Test [core]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        database: [Postgres, PGlite]
        runtime: [node, bun]
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Postgres
        if: ${{ matrix.database == 'Postgres' }}
        uses: ikalnytskyi/action-setup-postgres@v7
        id: postgres

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Test
        env:
          DATABASE_URL: ${{ matrix.database == 'Postgres' && steps.postgres.outputs.connection-uri || '' }}
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            pnpm --filter "ponder" test:bun
          else
            pnpm --filter "ponder" test
          fi

  test-clickhouse:
    name: Test [clickhouse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        database: [Postgres, PGlite]
        runtime: [node, bun]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8.14.39
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --spider http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Postgres
        if: ${{ matrix.database == 'Postgres' }}
        uses: ikalnytskyi/action-setup-postgres@v7
        id: postgres

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Typecheck ClickHouse package
        if: ${{ matrix.runtime == 'node' && matrix.database == 'Postgres' }}
        run: |
          pnpm --filter "@ponder/clickhouse" typecheck
          pnpm --filter clickhouse-acceptance typecheck

      - name: Test finalized sink contract
        env:
          DATABASE_URL: ${{ matrix.database == 'Postgres' && steps.postgres.outputs.connection-uri || '' }}
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            pnpm --filter "ponder" exec bun test src/sink/index.test.ts
          else
            pnpm --filter "ponder" exec vitest --run src/sink/index.test.ts
          fi

      - name: Test ClickHouse acceptance
        env:
          CLICKHOUSE_URL: http://127.0.0.1:8123
          DATABASE_URL: ${{ matrix.database == 'Postgres' && steps.postgres.outputs.connection-uri || '' }}
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            pnpm --filter "@ponder/clickhouse" test:acceptance:bun
            pnpm --filter clickhouse-acceptance test:bun
          else
            pnpm --filter "@ponder/clickhouse" test:acceptance
            pnpm --filter clickhouse-acceptance test
          fi


  test-create-ponder:
    name: Test [create-ponder]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: pnpm --filter create-ponder test
