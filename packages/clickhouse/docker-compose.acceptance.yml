services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    environment:
      # Allow passwordless HTTP access from the host for local acceptance tests.
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
