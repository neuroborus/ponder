services:
  postgres:
    image: postgres:16.14-alpine3.23
    environment:
      POSTGRES_DB: ponder
      POSTGRES_PASSWORD: ponder
      POSTGRES_USER: ponder
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponder -d ponder"]
      interval: 5s
      timeout: 3s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    environment:
      # Allow passwordless HTTP access from the host for local development only.
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
